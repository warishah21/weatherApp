name: Hour Pipeline

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: 
      API_KEY_HOPSWORKS: ${{ secrets.API_KEY_HOPSWORKS }}
      OPEN_WEATHER_API: ${{ secrets.OPEN_WEATHER_API }}
      AQICN_KEY: ${{ secrets.AQICN_KEY }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}


    steps:
      - name: Repository
        uses: actions/checkout@v4
      - name: setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirement2.txt

      - name: Install dependencies
        run: pip install -r requirement2.txt
      - name: Pipeline Run 
        run: python store.py
        
